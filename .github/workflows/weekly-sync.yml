name: Weekly Wiki Gear Ingestion

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  workflow_dispatch:      # Allows manual trigger via GitHub Actions UI

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Wiki Gear Scraper
        run: node scripts/scrape-wiki-gear.js

      - name: Commit updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gear_database.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): weekly wiki gear database sync" && git push)
